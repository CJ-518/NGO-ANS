# Base de datos embebida H2 (archivo local ./data/ngo_saeca.mv.db). No requiere instalar PostgreSQL.
# La carpeta de datos se puede cambiar con la variable de entorno NGO_DATA_DIR.
spring.datasource.url=jdbc:h2:file:${NGO_DATA_DIR:./data}/ngo_saeca;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# El esquema lo crea DatosIniciales con db/h2/schema.sql (incluye los DEFAULT de las fechas, que Hibernate no genera)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.main.banner-mode=off

# Atención de las solicitudes: minutos, desde que se crea la solicitud, que se estima que tarda un técnico
# en empezar a atenderla (pasado ese tiempo el cliente puede reclamar desde su link de seguimiento) y
# minutos que tienen que pasar entre un reclamo y el siguiente sobre la misma solicitud
# (2880 min = 48 horas; 720 min = 12 horas)
ngo.atencion.plazo-minutos=2880
ngo.atencion.reclamo-intervalo-minutos=720

# Configuración de logs para mantener la terminal limpia y mostrar solo errores críticos
logging.level.root=WARN
logging.level.org.hibernate=ERROR
logging.level.org.springframework.web=ERROR
org.springframework.boot=ERROR
