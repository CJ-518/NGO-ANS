spring.datasource.url=jdbc:postgresql://localhost:5432/ngo_saeca
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.main.banner-mode=off

# Atención de las solicitudes: horas, desde que se crea la solicitud, que se estima que tarda un técnico
# en empezar a atenderla (pasado ese tiempo el cliente puede reclamar desde su link de seguimiento) y
# horas que tienen que pasar entre un reclamo y el siguiente sobre la misma solicitud
ngo.atencion.plazo-horas=48
ngo.atencion.reclamo-intervalo-horas=12

# Configuración de logs para mantener la terminal limpia y mostrar solo errores críticos
logging.level.root=WARN
logging.level.org.hibernate=ERROR
logging.level.org.springframework.web=ERROR
org.springframework.boot=ERROR
