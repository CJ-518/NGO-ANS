<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO SAECA - Seguimiento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">NGO SAECA</div>
        <div class="user-role">Portal del Cliente</div>
    </header>

    <main>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Seguimiento de Solicitud</h1>
            <a href="index.html" style="text-decoration: none; color: #1a365d; font-weight: bold;">&larr; Volver al Panel</a>
        </div>
        
        <!-- Buscador -->
        <div class="card form-section" style="margin-bottom: 30px;">
            <label>Ingrese su número de solicitud (Ej: 1 para ST-1)</label>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <input type="text" id="nro-solicitud" placeholder="Número de solicitud" style="width: 200px;">
                <button id="btn-buscar" class="btn-primary">Consultar estado</button>
            </div>
        </div>

        <!-- Resultados (Ocultos por defecto) -->
        <div id="resultado-container" style="display: none;">
            <p style="color: #4a5568;">Estado actual</p>
            <h2 id="estado-actual" style="color: #2b6cb0; font-size: 28px; text-transform: uppercase; margin-top: 0;">EN DIAGNÓSTICO</h2>
            <p><strong>Última actualización:</strong> <span id="fecha-actualizacion"></span></p>

            <!-- Línea de tiempo visual -->
            <div class="timeline">
                <div class="timeline-step active">
                    <div class="circle"></div>
                    <p>Recibida</p>
                </div>
                <div class="timeline-line"></div>
                <div class="timeline-step">
                    <div class="circle"></div>
                    <p>Asignada</p>
                </div>
                <div class="timeline-line"></div>
                <div class="timeline-step">
                    <div class="circle"></div>
                    <p>Diagnóstico</p>
                </div>
                <div class="timeline-line"></div>
                <div class="timeline-step">
                    <div class="circle"></div>
                    <p>Finalizada</p>
                </div>
            </div>

            <!-- Historial Simplificado -->
            <h3 style="margin-top: 40px;">Detalles</h3>
            <table>
                <tbody id="historial-body">
                    <!-- Javascript will fill this -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="seguimiento.js"></script>
</body>
</html>
