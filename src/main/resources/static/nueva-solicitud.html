<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO SAECA - Nueva Solicitud</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">NGO SAECA</div>
        <div class="user-role">Gestión de garantías y servicio técnico</div>
    </header>

    <main>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Nueva solicitud técnica</h1>
            <a href="index.html" style="text-decoration: none; color: #1a365d; font-weight: bold;">&larr; Volver al Panel</a>
        </div>
        
        <form id="solicitud-form" class="form-container">
            <!-- Datos del Cliente -->
            <div class="card form-section">
                <h2>Datos del cliente</h2>
                <div class="form-grid">
                    <div>
                        <label>Documento</label>
                        <input type="text" id="documento" required pattern="^[0-9]+$">
                    </div>
                    <div>
                        <label>Nombre y apellido</label>
                        <input type="text" id="nombre" required>
                    </div>
                    <div>
                        <label>Teléfono</label>
                        <input type="text" id="telefono" required pattern="^\+?[0-9]+$">
                    </div>
                    <div>
                        <label>Correo electrónico</label>
                        <input type="email" id="correo">
                    </div>
                </div>
            </div>

            <!-- Datos del Producto -->
            <div class="card form-section">
                <h2>Datos del producto</h2>
                <p style="color: #4a5568; margin-top: 0;">
                    Escribí en cualquier campo para ver sugerencias de los productos registrados.
                    Al elegir uno, se completan los demás datos.
                </p>
                <div class="form-grid">
                    <div>
                        <label>Tipo de producto</label>
                        <input type="text" id="tipoProducto" list="lista-tipoProducto" autocomplete="off" required>
                        <datalist id="lista-tipoProducto"></datalist>
                    </div>
                    <div>
                        <label>Marca</label>
                        <input type="text" id="marca" list="lista-marca" autocomplete="off" required>
                        <datalist id="lista-marca"></datalist>
                    </div>
                    <div>
                        <label>Modelo</label>
                        <input type="text" id="modelo" list="lista-modelo" autocomplete="off" required>
                        <datalist id="lista-modelo"></datalist>
                    </div>
                    <div>
                        <label>Número de serie</label>
                        <input type="text" id="nroSerie" list="lista-nroSerie" autocomplete="off" required>
                        <datalist id="lista-nroSerie"></datalist>
                    </div>
                </div>

                <!-- Producto elegido y estado de su garantía (lo completa nueva-solicitud.js) -->
                <div id="info-producto" style="display: none; margin-top: 20px; padding: 12px 15px; border: 1px solid #cbd5e0; border-radius: 4px; background-color: #f7fafc;"></div>
            </div>

            <!-- Descripción del problema -->
            <div class="card form-section">
                <h2>Descripción del problema</h2>
                <textarea id="descripcion" rows="4" required style="width: 100%;"></textarea>
                
                <div style="margin-top: 20px; text-align: right;">
                    <button type="submit" class="btn-primary">Registrar Solicitud</button>
                </div>
            </div>
        </form>
    </main>

    <script src="nueva-solicitud.js"></script>
</body>
</html>
