# Genera el release portable (Java + H2 incluidos) cuando se sube un tag "v*"
# y lo publica en la pestaña Releases con el .zip adjunto.
name: Release portable

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Descargar el código del tag
        uses: actions/checkout@v4

      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Crear el release portable
        shell: pwsh
        run: .\crear-release.ps1

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          files: release/NGO-SAECA.zip
          generate_release_notes: true
